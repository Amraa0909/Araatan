# ARAATAN v0.6.1 Configuration
# Adaptive Risk-Aware Algorithmic Trading System

[system]
name = "ARAATAN"
version = "0.6.1"
symbols = ["XAUUSD", "USDJPY"]
timeframe = "M5"
timeframe_ms = 300000

[tickerall]
# TickerAll API Configuration (https://tickerall.com)
base_url = "https://api.tickerall.com"
# Bearer token: cf_api_... (can also be set via TICKERALL_API_KEY environment variable)
api_key = ""
# Broker Account ID: acc_... (can also be set via TICKERALL_ACCOUNT_ID)
account_id = ""

# Broker credentials (if creating session via POST /v1/sessions)
broker = "mt5"
server = "Demo-Server"
account = 0
password = ""

# Warmup bars required for models (Chronos-2 context 512 + labels + buffer = 600 bars = 50 hours)
warmup_bars = 600

[risk]
# Per-trade risk limit (1.0% = 0.01)
risk_pct = 0.01
max_loss = 0.02
max_slippage = 3.0

[storage]
database_url = "sqlite://araatan.db"

[cache]
# Custom cache directory path
cache_dir = "./.araatan_cache"
