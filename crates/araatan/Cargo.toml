[package]
name = "araatan"
version = "0.6.1"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
zsfm-core = { git = "https://github.com/Amraa0909/zsfm-rs", rev = "b161e3d", default-features = false }
zsfm-chronos = { git = "https://github.com/Amraa0909/zsfm-rs", rev = "b161e3d" }
zsfm-toto = { git = "https://github.com/Amraa0909/zsfm-rs", rev = "b161e3d" }

[lib]
name = "araatan"
path = "src/lib.rs"

[[bin]]
name = "araatan"
path = "src/main.rs"
